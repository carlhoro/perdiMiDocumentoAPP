version: "2"

linters:
  default: none
  enable:
    - decorder
    - depguard
    - errcheck
    - revive
  settings:
    decorder:
      dec-order: [type, const, var, func]
      disable-dec-order-check: false
    depguard:
      rules:
        domain:
          files:
            - "**/src/domain/**/*.go"
          deny:
            - pkg: perdimidocumento/src/infrastructure$
              desc: El dominio usa sus propios puertos para acceder a la infraestructura.
            - pkg: perdimidocumento/src/infrastructure/
              desc: El dominio usa sus propios puertos para acceder a la infraestructura.
    revive:
      enable-all-rules: false
      rules:
        # Los archivos Go usan minúsculas y snake_case.
        - name: filename-format
          arguments: ['^[_a-z][_a-z0-9]*\.go$']
        # Los identificadores usan camelCase o PascalCase y respetan inicialismos como ID.
        - name: var-naming

formatters:
  enable:
    - gci
    - gofmt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(perdimidocumento/)
    gofmt:
      simplify: false
